<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Site — Drag Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="game.css">
</head>
<body>
<header class="topbar">
  <h1>🏁 Drag Racing</h1>
  <nav>
    <a href="index.html">Αρχική</a> | <a href="about.html">About</a> | <a href="products.html">Products</a>
  </nav>
  <div class="cash-display">💵 <span id="cashValue">0</span>€</div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="race">🏎️ Αγώνας</button>
  <button class="tab-btn" data-tab="garage">🔧 Γκαράζ</button>
  <button class="tab-btn" data-tab="shop">🛒 Κατάστημα</button>
</nav>

<main>
  <!-- RACE TAB -->
  <section id="tab-race" class="tab-panel active">
    <div id="rivalSelect" class="rival-select">
      <h2>Επίλεξε Αντίπαλο</h2>
      <div id="rivalList" class="rival-list"></div>
    </div>

    <div id="raceScreen" class="race-screen hidden">
      <canvas id="raceCanvas" width="900" height="260"></canvas>

      <div class="hud">
        <div class="hud-col">
          <div class="hud-label">ΕΣΥ</div>
          <div class="rpm-gauge"><div id="playerRpmFill" class="rpm-fill"></div><div class="rpm-zone-green"></div></div>
          <div class="hud-row"><span>Ταχύτητα: <b id="playerSpeed">0</b> km/h</span><span>Σχέση: <b id="playerGear">1</b></span></div>
        </div>
        <div class="hud-col">
          <div class="hud-label">ΑΝΤΙΠΑΛΟΣ</div>
          <div class="rpm-gauge"><div id="rivalRpmFill" class="rpm-fill rival"></div><div class="rpm-zone-green"></div></div>
          <div class="hud-row"><span>Ταχύτητα: <b id="rivalSpeed">0</b> km/h</span><span>Σχέση: <b id="rivalGear">1</b></span></div>
        </div>
      </div>

      <div id="raceMessage" class="race-message"></div>
      <div id="countdown" class="tree hidden">
        <div class="bulb amber"></div>
        <div class="bulb amber"></div>
        <div class="bulb amber"></div>
        <div class="bulb green"></div>
      </div>

      <div class="controls">
        <button id="btnStart" class="big-btn start-btn">ΕΚΚΙΝΗΣΗ 🚦</button>
        <button id="btnGas" class="big-btn gas-btn hidden">ΓΚΑΖΙ 🔥</button>
        <button id="btnShift" class="big-btn shift-btn hidden">ΑΛΛΑΓΗ ⬆️</button>
        <button id="btnBack" class="small-btn hidden">↩ Πίσω</button>
      </div>
      <p class="hint">Κράτα <kbd>Space</kbd> για γκάζι, πάτα <kbd>↑</kbd> για αλλαγή σχέσης — ή χρησιμοποίησε τα κουμπιά σε κινητό.</p>
    </div>
  </section>

  <!-- GARAGE TAB -->
  <section id="tab-garage" class="tab-panel">
    <h2>Το Γκαράζ σου</h2>
    <div id="garageCars" class="car-grid"></div>
    <div id="garageDetail" class="garage-detail"></div>
  </section>

  <!-- SHOP TAB -->
  <section id="tab-shop" class="tab-panel">
    <h2>Κατάστημα Αυτοκινήτων</h2>
    <div id="shopCars" class="car-grid"></div>
  </section>
</main>

<div id="resultModal" class="modal hidden">
  <div class="modal-box">
    <h2 id="resultTitle">Νίκη!</h2>
    <p id="resultDetail"></p>
    <div class="modal-actions">
      <button id="resultAgain" class="small-btn">Ξανά</button>
      <button id="resultClose" class="small-btn">Συνέχεια</button>
    </div>
  </div>
</div>

<footer>
  <button id="resetSave" class="reset-link">Επαναφορά αποθηκευμένων δεδομένων</button>
</footer>

<script src="tracker.js" defer></script>
<script src="game.js" defer></script>
</body>
</html>
